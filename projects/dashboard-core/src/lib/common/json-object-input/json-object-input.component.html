@if (object) {
  <lib-json-object-table
    class="w-full mx-auto"
    [object]="object"
    [excludeKeys]="excludeKeys"
    [deleteButton]="true"
    (delete)="deleteProperty($event)"
  ></lib-json-object-table>
}
<fieldset class="fieldset">
  <legend class="fieldset-label">New Property</legend>
  <div class="join w-full" [formGroup]="formGroup">
    <input
      class="input input-bordered join-item"
      [class.input-error]="duplicateKey"
      placeholder="Key"
      formControlName="key"
      name="value"
    />
    <input class="input input-bordered join-item" placeholder="Value" formControlName="value" name="value" />
    <button
      type="button"
      class="btn btn-soft btn-primary join-item border-primary"
      [disabled]="duplicateKey"
      (click)="addProperty()"
    >
      Add
    </button>
  </div>
  @if (duplicateKey) {
    <p class="fieldset-label text-error">A property with this key already exists</p>
  }
</fieldset>
